<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>
		{% if title%}
		FASTAPI Blog --{{title}}
		{%else%}
		FASTAPI Blog
		{%endif%}
	</title>
</head>
<body>
	<header>
		<h1>Home Page</h1>
	</header>
	<main>
		{% for post in posts %}
			<article>
				<h2>{{ post.title }}</h2>
				<p>{{ post.content }}</p>
			</article>
		{% endfor %}
		
	</main>
</body>
</html>
